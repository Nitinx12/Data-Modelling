<svg xmlns="http://www.w3.org/2000/svg" width="880" height="150" viewBox="0 0 880 150" role="img" aria-label="Tech stack: MongoDB, PostgreSQL, Python, pandas, uv, SQLAlchemy, PyMongo, Rich, ruff, pytest, GitHub Actions, Bash, PowerShell">
