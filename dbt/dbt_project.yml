name: "warehouse"
version: "1.0.0"
config-version: 2

profile: "warehouse"

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  warehouse:
    staging:
      +materialized: view
      +schema: staging
    core:
      +materialized: table
      +schema: core

# dbt docs lineage mirrors the hand-built MODEL_SEQUENCE (dims before facts)
# Keep custom PL/pgSQL DQ loops + GX as second gate — dbt tests are a
# framework-native mirror (not_null/unique/relationships) of loops 1,3,5.
