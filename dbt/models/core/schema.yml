version: 2

models:
  # Dimensions — SCD tests mirror SQL loops 1,3,5 (not_null/unique/relationships)
  - name: dim_customers
    description: "SCD2 customer dimension — one current row per customer_id + history (valid_from/to/is_current). See models/dim_customers.sql."
    columns:
      - name: customer_key
        description: Surrogate key (new per version)
        tests:
          - not_null
          - unique
      - name: customer_id
        description: Business key — unique per (customer_id, valid_from), one is_current per customer_id
        tests:
          - not_null
      - name: customer_name
        tests:
          - not_null:
              config:
                where: "customer_id IS NOT NULL"
      - name: valid_from
        tests: [not_null]
      - name: is_current
        tests: [not_null]

  - name: dim_products
    columns:
      - name: product_key
        tests: [not_null, unique]
      - name: product_code
        tests: [not_null, unique]
      - name: product_name
        tests: [not_null]

  - name: dim_geo
    columns:
      - name: geo_key
        tests: [not_null, unique]
      - name: city_name
        tests: [not_null, unique]

  - name: dim_orders_flag
    columns:
      - name: flag_key
        tests: [not_null, unique]

  - name: dim_campaign
    columns:
      - name: campaign_key
        tests: [not_null, unique]
      - name: campaign_name
        tests: [not_null, unique]

  # Facts — grain + FK orphan checks mirror loop 5
  - name: fact_orders
    description: "One row per order line (transaction fact), as-of join to SCD2 dim_customers."
    columns:
      - name: order_id
        tests: [not_null]
      - name: line_id
        tests: [not_null]
      - name: customer_key
        tests:
          - relationships:
              to: ref('dim_customers')
              field: customer_key
      - name: product_key
        tests:
          - relationships:
              to: ref('dim_products')
              field: product_key
      - name: flag_key
        tests:
          - relationships:
              to: ref('dim_orders_flag')
              field: flag_key
      - name: ship_geo_key
        tests:
          - relationships:
              to: ref('dim_geo')
              field: geo_key
      - name: bill_geo_key
        tests:
          - relationships:
              to: ref('dim_geo')
              field: geo_key
    tests:
      # Unique order line (mirrors uq_fact_orders_order_line)
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [order_id, line_id]

  - name: fact_order_process
    description: Accumulating snapshot — one row per order, COALESCE-guarded milestones.
    columns:
      - name: order_id
        tests: [not_null, unique]
      - name: customer_key
        tests:
          - relationships:
              to: ref('dim_customers')
              field: customer_key

  - name: fact_campaign_spend
    columns:
      - name: campaign_name
        tests: [not_null]
      - name: spend_date
        tests: [not_null]
      - name: campaign_key
        tests:
          - relationships:
              to: ref('dim_campaign')
              field: campaign_key
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [campaign_name, spend_date]

  - name: fact_inventory
    columns:
      - name: product_name
        tests: [not_null]
      - name: period_month
        tests: [not_null]
      - name: product_key
        tests:
          - relationships:
              to: ref('dim_products')
              field: product_key
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [product_name, period_month]

  - name: fact_less_fact
    description: Factless fact — no measures, one row per campaign×SKU.
    columns:
      - name: campaign_key
        tests:
          - relationships:
              to: ref('dim_campaign')
              field: campaign_key
      - name: product_key
        tests:
          - relationships:
              to: ref('dim_products')
              field: product_key
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [campaign_key, product_key]
