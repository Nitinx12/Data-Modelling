[project]
name = "data-modelling"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Nitin", email = "nitin321x@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "databricks-sql-connector>=4.5.0",
    "makefile>=1.1.0",
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "plotly>=7.0.0",
    "polors>=0.2.4",
    "psycopg2-binary>=2.9.12",
    "pymongo>=4.17.0",
    "pyspark>=4.2.0",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.3",
    "rich>=15.0.0",
    "seaborn>=0.13.2",
    "sql>=2022.4.0",
    "sqlalchemy>=2.0.52",
    "yml>=0.0.1",
]

[project.scripts]
data-modelling = "data_modelling:main"
pipeline = "main:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"


[tool.uv]
package = false

[dependency-groups]
dev = [
    "ruff>=0.16.5",
    "pytest>=9.1.1",
    "pytest-cov>=6.0.0",
    "great-expectations>=1.0.0",
]

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests/unit"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]
