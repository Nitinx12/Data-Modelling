# =====================================================================
# ci.yml — linting + unit tests for every push and PR
# =====================================================================
# Runs on:
#   - push to main
#   - pull_request against main
#
# This is intentionally DB-free.  The unit tests in tests/unit/ mock all
# external clients (sqlalchemy, pymongo, databricks_sql), so they run in
# seconds on a clean GitHub-hosted runner with no services attached.
#
# For DB-touching checks (data-quality loops, full pipeline), run them
# locally or wire a separate job with a Postgres service container.
# =====================================================================

name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# Cancel in-flight runs for the same branch / PR when a new push arrives.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint & unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: latest
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.13

      - name: Sync dependencies
        run: uv sync --group dev --frozen

      - name: Ruff — lint
        run: uv run ruff check .

      - name: Ruff — format check
        run: uv run ruff format --check .

      - name: Pytest — unit tests
        run: uv run pytest tests/unit -v

      - name: Pytest — coverage (term + html)
        if: success()
        run: uv run pytest tests/unit --cov=utils --cov-report=term-missing --cov-report=html:htmlcov

      - name: Upload coverage HTML artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: htmlcov/
          retention-days: 7
          if-no-files-found: ignore
