# =====================================================================
# release.yml — cut a GitHub Release on version tags
# =====================================================================
# Trigger:
#   - push of tag v* (e.g. v0.1.0) — see docs/GIT_WORKFLOW.md Releases
#   - manual dispatch (dry run without tag)
#
# Creates a release with auto-generated notes.
# Requires no extra secrets — uses GITHUB_TOKEN.
# =====================================================================

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
