# =====================================================================
# docker-publish.yml — build + push the pipeline image to GHCR
# =====================================================================
# Runs on:
#   - push of tag v* (e.g. v0.1.0) — versioned image, aligns with release.yml
#   - push to main                — refreshes the `latest` image
#
# Image: ghcr.io/nitinx12/data-modelling (lowercase required by GHCR).
# Auth uses GITHUB_TOKEN — no extra secrets. Tags come from
# docker/metadata-action: full + minor semver on tags, `latest` on main.
# Layer caching via the GitHub Cache API keeps rebuilds fast.
# The Dockerfile cannot be verified on a box without a Docker daemon;
# this workflow is the first real build — watch it green before release.
# =====================================================================

name: Docker Publish

on:
  push:
    branches: ["main"]
    tags: ["v*"]

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Build and push image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/nitinx12/data-modelling
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
