# =====================================================================
# label.yml — auto label PRs by changed paths (uses labeler.yml)
# =====================================================================
# Runs on: pull_request (synchronize = pushes to PR branch)
# Requires: .github/labeler.yml
# Docs: https://github.com/actions/labeler
# For forks needing write, switch to pull_request_target and review
# token permissions carefully.
# =====================================================================

name: Label

on:
  pull_request:
    branches: ["main"]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: label-${{ github.ref }}
  cancel-in-progress: true

jobs:
  label:
    name: Auto label
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply labels
        uses: actions/labeler@v5
        with:
          repo-token: "${{ secrets.GITHUB_TOKEN }}"
          configuration-path: .github/labeler.yml
          sync-labels: true
