# negative_numeric_suite.yaml
# ============================
# Expectation suite: no numeric measure column should contain negative values.
# Mirrors tests/03_lp_negative_numeric_checks.sql
expectations:
  - expectation_type: expect_column_values_to_be_between
    kwargs:
      column: budget
      min_value: 0
    meta: { schema: core.dim_campaign }

  - expectation_type: expect_column_values_to_be_between
    kwargs:
      column: unit_price
      min_value: 0
    meta: { schema: core.dim_products }

