# required_text_suite.yaml
# =========================
# Expectation suite: core tables should have no blank required text columns.
# Mirrors tests/01_lp_required_text_checks.sql
# Usage: uv run scripts/python/gx_run.py --suite required_text_suite
#        make gx SUITE=required_text_suite
expectations:
  - expectation_type: expect_column_values_to_not_be_null
    kwargs:
      column: campaign_name
      mostly: 1.0
    meta: { schema: core.dim_campaign, reason: "business key — must be present" }

  - expectation_type: expect_column_values_to_not_be_null
    kwargs:
      column: customer_id
      mostly: 1.0
    meta: { schema: core.dim_customers, reason: "business key" }

  - expectation_type: expect_column_values_to_not_be_null
    kwargs:
      column: customer_name
      mostly: 1.0
    meta: { schema: core.dim_customers }

  - expectation_type: expect_column_values_to_not_be_null
    kwargs:
      column: city_name
      mostly: 1.0
    meta: { schema: core.dim_geo, reason: "business key" }

  - expectation_type: expect_column_values_to_not_be_null
    kwargs:
      column: product_code
      mostly: 1.0
    meta: { schema: core.dim_products, reason: "business key" }

  - expectation_type: expect_column_values_to_not_be_null
    kwargs:
      column: product_name
      mostly: 1.0
    meta: { schema: core.dim_products }

  # NOTE: no not-null check on unit_price. The model deliberately keeps
  # products with invalid prices and NULLs the price out (see
  # docs/data_catlog.md) — negative_numeric_suite covers "price must be
  # positive when present" instead, which ignores NULLs.

  - expectation_type: expect_column_values_to_not_be_null
    kwargs:
      column: order_id
      mostly: 1.0
    meta: { schema: core.fact_orders, reason: "business key (with line_id)" }

  - expectation_type: expect_column_values_to_not_be_null
    kwargs:
      column: line_id
      mostly: 1.0
    meta: { schema: core.fact_orders, reason: "composite business key" }

  - expectation_type: expect_column_values_to_not_be_null
    kwargs:
      column: customer_key
      mostly: 1.0
    meta: { schema: core.fact_orders, reason: "dimension FK" }

  - expectation_type: expect_column_values_to_not_be_null
    kwargs:
      column: product_key
      mostly: 1.0
    meta: { schema: core.fact_orders, reason: "dimension FK" }

  - expectation_type: expect_column_values_to_not_be_null
    kwargs:
      column: flag_key
      mostly: 1.0
    meta: { schema: core.fact_orders, reason: "dimension FK" }

  - expectation_type: expect_column_values_to_not_be_null
    kwargs:
      column: ship_geo_key
      mostly: 1.0
    meta: { schema: core.fact_orders, reason: "role-playing dimension FK" }

  - expectation_type: expect_column_values_to_not_be_null
    kwargs:
      column: bill_geo_key
      mostly: 1.0
    meta: { schema: core.fact_orders, reason: "role-playing dimension FK" }
